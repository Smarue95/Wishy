<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wishy</title>
<meta name="theme-color" content="#8C1F4B">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Yellowtail&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-app:#EFE3CE; --surface:#FFFBF3; --surface-alt:#F3E7D2; --ink:#2C2013; --ink-soft:#6B5D48;
    --primary:#8C1F4B; --primary-soft:#F1D9E1; --accent:#D6A13C; --border:rgba(44,32,19,0.14); --shadow:rgba(44,32,19,0.22);
  }
  [data-theme="dark"]{
    --bg-app:#140D18; --surface:#211623; --surface-alt:#2A1B2C; --ink:#F3E7D2; --ink-soft:#C4B3A4;
    --primary:#E8628A; --primary-soft:rgba(232,98,138,0.16); --accent:#E8B75C; --border:rgba(243,231,210,0.12); --shadow:rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;}
  html, body{ height:100%; }
  body{
    margin:0; min-height:100vh;
    background: var(--surface);
    font-family:'Work Sans', sans-serif; color:var(--ink);
  }
  .phone{
    width:100%; max-width:640px; margin:0 auto;
    min-height:100vh; min-height:100dvh;
    background:var(--surface);
    display:flex; flex-direction:column;
  }
  .splash{
    position:fixed; inset:0; z-index:9999;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, #0B0710 0%, #4C1D95 55%, #9333EA 100%);
    transition: opacity 0.5s ease;
  }
  .splash.hide{ opacity:0; pointer-events:none; }
  .splash-mark{
    font-family:'Yellowtail', cursive;
    font-size: clamp(90px, 26vw, 240px);
    color:#fff; line-height:1;
  }
  .appbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: max(20px, env(safe-area-inset-top)) 20px 14px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-name{
    font-family:'Yellowtail', cursive; font-size:2rem; color:var(--primary); line-height:1;
  }
  .theme-toggle{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--surface-alt);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);
  }
  .theme-toggle svg{width:17px; height:17px;}
  .code-bar{
    display:flex; align-items:center; justify-content:space-between; margin:0 20px 10px; padding:9px 13px;
    background:var(--surface-alt); border:1px solid var(--border); border-radius:12px; font-size:0.78rem; color:var(--ink-soft);
  }
  .code-bar b{color:var(--ink); font-family:'Fraunces', serif; letter-spacing:1px; font-size:0.95rem;}
  .code-bar button{background:none; color:var(--primary); font-size:0.76rem; padding:2px; text-decoration:underline;}
  .install-banner{
    display:none; align-items:center; justify-content:space-between; gap:10px;
    margin:0 20px 10px; padding:12px 14px;
    background:var(--primary); color:#fff; border-radius:14px; font-size:0.85rem; font-weight:600;
  }
  .install-banner button{ background:#fff; color:var(--primary); padding:8px 14px; font-size:0.82rem; flex-shrink:0; }
  .content{flex:1; padding:6px 20px calc(20px + env(safe-area-inset-bottom)); overflow-y:auto;}
  h1.headline{
    font-family:'Fraunces', serif; font-weight:600; font-size:1.5rem; line-height:1.15; margin:6px 0 4px; color:var(--ink);
  }
  .lede{color:var(--ink-soft); font-size:0.9rem; margin:0 0 22px; line-height:1.45;}
  label{display:block; font-size:0.78rem; color:var(--ink-soft); margin-bottom:6px; font-weight:500;}
  input[type="text"], input[type="number"], input[type="date"], select{
    width:100%; font-family:'Work Sans', sans-serif; font-size:0.95rem; padding:11px 13px;
    border:1px solid var(--border); background:var(--surface-alt); color:var(--ink); border-radius:12px; }
  input:focus, select:focus{outline:2px solid var(--primary); outline-offset:1px;}
  .row{display:flex; gap:10px;} .row > *{flex:1;}
  .field{margin-bottom:14px;}
  button{ font-family:'Work Sans', sans-serif; font-weight:600; font-size:0.9rem; cursor:pointer; border:none; border-radius:12px; }
  .btn-add{background:var(--primary); color:#fff; padding:11px 16px; white-space:nowrap; flex-shrink:0;}
  .btn-primary{background:var(--primary); color:#fff; padding:14px 20px; width:100%; font-size:0.98rem;}
  .btn-primary:disabled{background:var(--surface-alt); color:var(--ink-soft); cursor:not-allowed;}
  .btn-secondary{background:var(--surface-alt); color:var(--ink); padding:12px 18px; width:100%; border:1px solid var(--border);}
  .btn-ghost{background:none; color:var(--ink-soft); padding:10px 4px; text-decoration:underline; text-underline-offset:3px; font-weight:500; font-size:0.85rem;}
  .card{background:var(--surface-alt); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:16px;}
  .participant-list{list-style:none; margin:0 0 20px; padding:0;}
  .participant-list li{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 4px; border-bottom:1px solid var(--border);}
  .p-name{font-weight:600; font-size:0.94rem;}
  .p-remove{background:none; border:none; color:var(--ink-soft); font-size:1.05rem; padding:4px 6px;}
  .p-remove:hover{color:var(--primary);}
  .empty{color:var(--ink-soft); font-size:0.88rem; font-style:italic; padding:10px 0 18px;}
  .note{font-size:0.8rem; color:var(--ink-soft); margin-top:6px; line-height:1.4;}
  .warn{font-size:0.78rem; color:var(--ink-soft); background:var(--primary-soft); border-radius:12px; padding:11px 13px; margin-bottom:18px; line-height:1.4;}
  .reveal-card{background:linear-gradient(155deg, var(--primary-soft), var(--surface-alt)); border:1px solid var(--border); border-radius:18px; padding:24px 20px; text-align:center; margin-top:14px;}
  .reveal-card .to{font-size:0.8rem; color:var(--ink-soft); margin-bottom:6px;}
  .reveal-card .name{font-family:'Fraunces', serif; font-size:1.7rem; font-weight:600; color:var(--primary); margin:0 0 10px;}
  .reveal-card .budget{font-size:0.86rem; color:var(--ink-soft); margin-bottom:14px;}
  .reveal-card a.giftlink{display:inline-block; margin-top:2px; color:var(--ink); font-weight:600; text-decoration:none; border-bottom:1.5px solid var(--accent); font-size:0.9rem;}
  .sweet-card{background:var(--surface-alt); border:1px solid var(--border); border-radius:18px; padding:20px; text-align:center; margin-bottom:16px;}
  .sweet-card .idea{font-family:'Fraunces', serif; font-size:1.12rem; font-weight:500; color:var(--ink); margin:14px 0 12px; line-height:1.35;}
  .sweet-banner{ display:flex; align-items:center; gap:10px; background:var(--accent); color:#2C2013; border-radius:14px; padding:13px 15px; margin-bottom:16px; font-weight:600; font-size:0.9rem; }
  .countdown-row{display:flex; gap:10px; margin-bottom:16px;}
  .countdown{flex:1; text-align:center; padding:14px 8px; border-radius:16px; background:var(--primary-soft);}
  .countdown .num{font-family:'Fraunces', serif; font-size:1.7rem; font-weight:700; color:var(--primary); display:block; line-height:1;}
  .countdown .lbl{font-size:0.72rem; color:var(--ink-soft); margin-top:4px; line-height:1.3;}
  .bottom-nav{display:flex; border-top:1px solid var(--border); background:var(--surface); padding-bottom:env(safe-area-inset-bottom);}
  .nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 4px 14px; background:none; border:none; color:var(--ink-soft); font-size:0.7rem; font-weight:600; border-radius:0;}
  .nav-btn svg{width:20px; height:20px;}
  .nav-btn.active{color:var(--primary);}
  .notif-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .notif-status{font-size:0.78rem; color:var(--ink-soft);}
</style>
</head>
<body>
<div class="splash" id="splash"><div class="splash-mark">W</div></div>
<div class="phone">
  <div class="appbar">
    <div class="brand">
      <span class="brand-name">Wishy</span>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema"></button>
  </div>
  <div id="codeBar"></div>
  <div class="install-banner" id="installBanner">
    <span>Instala Wishy como app</span>
    <button id="installBtn">Instalar</button>
  </div>
  <div class="content" id="app"></div>
  <div class="bottom-nav" id="bottomNav" style="display:none;">
    <button class="nav-btn" data-tab="grupo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Grupo
    </button>
    <button class="nav-btn" data-tab="resultado">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13"/><path d="M12 8C9.5 8 8 6 8 4.5S9 2 10 2c1.5 0 2 2 2 6z"/><path d="M12 8c2.5 0 4-2 4-3.5S15 2 14 2c-1.5 0-2 2-2 6z"/></svg>
      Mi resultado
    </button>
    <button class="nav-btn" data-tab="endulzar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12a4 4 0 0 1 4-4h0a4 4 0 0 1 4 4v0a4 4 0 0 1-4 4h0a4 4 0 0 1-4-4v0z"/><path d="m5 5 2.5 2.5"/><path d="m16.5 16.5 2.5 2.5"/><path d="m19 5-2.5 2.5"/><path d="m7.5 16.5-2.5 2.5"/></svg>
      Endulzar
    </button>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
